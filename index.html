<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101125" />
    <meta name="description" content="Explore 25 quiz worlds in a playful, fast-paced interactive adventure." />
    <title>Quiz Universe — Interactive Trivia Adventure</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://www.youtube.com/game_api/v1"></script>
  </head>
  <body>
    <div id="app-loader" class="app-loader" aria-label="Loading Quiz Universe">
      <div class="loader-content">
        <span class="loader-mark">✦</span>
        <h1 class="loader-title">quiz<span class="brand-light">universe</span></h1>
        <div class="loader-bar"><div class="loader-progress"></div></div>
        <p class="loader-text">Loading cosmic trivia realms…</p>
      </div>
    </div>
    <div class="sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="app" class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Quiz Universe home">
          <span class="brand-mark"><span>✦</span></span>
          <span>quiz<span class="brand-light">universe</span></span>
        </a>
        <div class="topbar-actions">
          <button class="hud-pill" id="lives-pill" aria-label="Lives and recovery time">
            <span class="heart-icon">♥</span><strong id="lives-count">5</strong><span class="pill-divider"></span><span id="life-clock">full</span>
          </button>
          <button class="hud-pill coin-pill" aria-label="Coins">
            <span class="coin-icon">✦</span><strong id="coin-count">120</strong>
          </button>
          <button class="icon-button sound-toggle" id="sound-toggle" aria-label="Toggle sound effects" title="Toggle sound effects">♫</button>
          <button class="icon-button music-toggle" id="music-toggle" aria-label="Toggle background music" title="Toggle background music">♪</button>
          <button class="icon-button settings-toggle" id="settings-button" aria-label="Game settings" title="Game settings">⚙</button>
          <button class="avatar-button" id="profile-button" aria-label="Player stats">A</button>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>
      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span>⌂</span><small>Explore</small></button>
        <button class="nav-item" data-view="collection"><span>✧</span><small>Collection</small><b class="nav-dot"></b></button>
        <button class="nav-item" data-view="stats"><span>▥</span><small>Stats</small></button>
      </nav>
      <div id="toast-region" class="toast-region" aria-live="polite"></div>
    </div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
